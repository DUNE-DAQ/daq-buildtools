name: Test daq-buildtools

on:
  pull_request:
    branches:
      - develop
      - amogan/test_daq_buildtools_workflow
    types: [opened, reopened, synchronize]

jobs:
  test_daq_buildtools:
    name: Test daq-buildtools
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dune-daq/nightly-release-alma9:development_v5
    defaults:
      run:
        shell: bash
    steps:
    - id: checkout_daq_buildtools
      uses: actions/checkout@v6
      with:
        path: daq-buildtools-test

    #- uses: cvmfs-contrib/github-action-cvmfs@v5
    #  with:
    #    cvmfs_repositories: 'dunedaq.opensciencegrid.org'

    - name: Troubleshoot llvm package
      run: |
        source /cvmfs/dunedaq.opensciencegrid.org/setup_dunedaq.sh
        setup_dbt latest
        dbt-setup-release -n last_fddaq
        spack find llvm
        spack find --loaded llvm
        spack list llvm

    - name: Run test_daq-buildtools script
      run: |
        cd daq-buildtools-test
        source env.sh
        cd scripts
        ./test_daq-buildtools.sh --dbt-branch ${{ github.head_ref }}
        

